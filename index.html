<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%brand/sea-resume-logo-generated.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f8" />
    <meta name="description" content="Sea Resume — 简洁、灵活的中文简历制作工具" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Sea Resume — 简历制作与管理</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('sea-resume-color-scheme');
          var dark = mode === 'dark' || ((mode !== 'light') && matchMedia('(prefers-color-scheme: dark)').matches);
          if (mode === 'light' || mode === 'dark') document.documentElement.dataset.mode = mode;
          document.documentElement.classList.toggle('dark', dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#141820' : '#f4f6f8');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
