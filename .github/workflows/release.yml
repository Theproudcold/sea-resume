name: Release

# 打 tag 是发版的最后一步：tag 只打在已经通过 Tests and build 并合入 master 的提交上，
# workflow 再校验 tag 与版本号一致，才生成 Release 与附带的构建产物。
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm

      # 版本号是 tag 的唯一来源约束：两边不一致直接失败，避免把版本号打错。
      - name: Check tag matches package.json
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 版本 $expected 不一致"
            exit 1
          fi

      # tag 必须落在 master 的历史上，防止从功能分支误打发布 tag。
      - name: Check tag is on master
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_REF_NAME" origin/master; then
            echo "::error::tag $GITHUB_REF_NAME 不在 origin/master 的历史上"
            exit 1
          fi

      - name: Check CHANGELOG has this version
        run: |
          if ! grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少 ${GITHUB_REF_NAME#v} 的条目"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and build
        run: pnpm verify

      - name: Package site
        run: |
          cp dist/index.html dist/404.html
          tar -C dist -czf "sea-resume-${GITHUB_REF_NAME}.tar.gz" .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          # 预发布标签形如 v1.1.0-rc.1，不占用「Latest」。
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: sea-resume-${{ github.ref_name }}.tar.gz
